[project]
name = "agent-kit-dev"
version = "0.0.0"
description = "Dev tooling for Agent-kit. Not a published package."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.13",
  "pre-commit>=4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["*.test.py"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

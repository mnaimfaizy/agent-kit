version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned deliberately and asserted by the contract tests; bump by hand
      # after reading the release notes (see CONTRIBUTING.md).
      - dependency-name: anthropics/claude-code-action

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        patterns: ["*"]

name: External links

# Weekly check of external URLs in the docs. External sites flake, so this
# stays off the PR path and opens (or updates) one tracking issue instead.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --exclude-path node_modules --exclude-path .venv './**/*.md'
          output: lychee-report.md
          fail: false
      - name: Open or update tracking issue
        if: ${{ steps.lychee.outputs.exit_code != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Broken external links"
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file lychee-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file lychee-report.md
          fi

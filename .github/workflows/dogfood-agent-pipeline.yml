name: Dogfood agent pipeline

# Agent-kit running plan → implement → review on its own issues and PRs, from
# this commit (local ref). Off until the repository variable
# CLAUDE_AGENT_FLOW_ENABLED is "true" and CLAUDE_CODE_OAUTH_TOKEN exists. A Stage
# switch (CLAUDE_PLAN_ENABLED, _IMPLEMENT_, _REVIEW_) set to "false" turns one off.
# With CLAUDE_REVIEW_RESPONSE_MODE set to "auto", a review that leaves findings
# hands off to dogfood-review-response.yml. Setup: CONTRIBUTING.md → "Dogfood flows".

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  plan:
    if: ${{ github.event_name == 'issues' && github.event.label.name == 'agent:plan' }}
    uses: ./.github/workflows/agent-plan-reusable.yml
    with:
      kill_switch: ${{ vars.CLAUDE_AGENT_FLOW_ENABLED != 'true' || vars.CLAUDE_PLAN_ENABLED == 'false' }}
      model: ${{ vars.CLAUDE_PLAN_MODEL || vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
      effort: ${{ vars.CLAUDE_PLAN_EFFORT || vars.CLAUDE_EFFORT || '' }}
      allowlist_actors: '["mnaimfaizy"]'
      trigger_label: "agent:plan"
      issue_number: ${{ format('{0}', github.event.issue.number) }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  implement:
    if: ${{ github.event_name == 'issues' && github.event.label.name == 'agent:implement' }}
    uses: ./.github/workflows/agent-implement-reusable.yml
    with:
      kill_switch: ${{ vars.CLAUDE_AGENT_FLOW_ENABLED != 'true' || vars.CLAUDE_IMPLEMENT_ENABLED == 'false' }}
      model: ${{ vars.CLAUDE_IMPLEMENT_MODEL || vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
      effort: ${{ vars.CLAUDE_IMPLEMENT_EFFORT || vars.CLAUDE_EFFORT || '' }}
      allowlist_actors: '["mnaimfaizy"]'
      trigger_label: "agent:implement"
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      base_branch: "main"
      setup_commands: |
        pipx install uv==0.11.23
        uv sync --locked
        npm ci
      verify_commands: |
        set -e
        uv run pytest
        npm test
        uv run ruff check .
        uv run ruff format --check .
        npx prettier --check .
      extra_allowed_tools: "Bash(uv run pytest:*),Bash(uv run ruff:*),Bash(npm test:*),Bash(npx prettier:*)"
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'agent:review' }}
    # What agent-review-reusable.yml's jobs request: its handoff job needs
    # actions: write, and GitHub refuses the run if the Caller grants less.
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: write
    uses: ./.github/workflows/agent-review-reusable.yml
    with:
      kill_switch: ${{ vars.CLAUDE_AGENT_FLOW_ENABLED != 'true' || vars.CLAUDE_REVIEW_ENABLED == 'false' }}
      model: ${{ vars.CLAUDE_REVIEW_MODEL || vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
      effort: ${{ vars.CLAUDE_REVIEW_EFFORT || vars.CLAUDE_EFFORT || '' }}
      allowlist_actors: '["mnaimfaizy"]'
      # Without a Verified plan, grade Spec against a maintainer brief: an issue
      # comment that starts with <!-- agent-kit-brief --> by a listed login.
      trusted_spec_authors: '["mnaimfaizy"]'
      trigger_label: "agent:review"
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      base_ref: ${{ github.event.pull_request.base.ref }}
      is_fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      # Auto mode (CLAUDE_REVIEW_RESPONSE_MODE set to exactly `auto`) hands a
      # finished review that left findings to dogfood-review-response.yml on
      # main. Keep the two lists equal to that Caller's allowlist_actors and
      # reviewer_logins. Unset is manual: nothing is handed off.
      response_mode: ${{ vars.CLAUDE_REVIEW_RESPONSE_MODE || 'manual' }}
      response_workflow: .github/workflows/dogfood-review-response.yml
      response_allowlist_actors: '["mnaimfaizy"]'
      response_reviewer_logins: "[]"
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

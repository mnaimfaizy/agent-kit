name: Dogfood agent pipeline

# Agent-kit running plan → implement → review on its own issues and PRs, from
# this commit (local ref). Off until the repository variable
# CLAUDE_PIPELINE_ENABLED is "true" and CLAUDE_CODE_OAUTH_TOKEN exists.
# Setup: CONTRIBUTING.md → "Dogfood flows".

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  plan:
    if: ${{ github.event_name == 'issues' && github.event.label.name == 'agent:plan' }}
    uses: ./.github/workflows/agent-plan-reusable.yml
    with:
      kill_switch: ${{ vars.CLAUDE_PIPELINE_ENABLED != 'true' }}
      allowlist_actors: '["mnaimfaizy"]'
      trigger_label: "agent:plan"
      issue_number: ${{ format('{0}', github.event.issue.number) }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  implement:
    if: ${{ github.event_name == 'issues' && github.event.label.name == 'agent:implement' }}
    uses: ./.github/workflows/agent-implement-reusable.yml
    with:
      kill_switch: ${{ vars.CLAUDE_PIPELINE_ENABLED != 'true' }}
      allowlist_actors: '["mnaimfaizy"]'
      trigger_label: "agent:implement"
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      base_branch: "main"
      setup_commands: |
        pipx install uv==0.11.23
        uv sync --locked
        npm ci
      verify_commands: |
        set -e
        uv run pytest
        npm test
        uv run ruff check .
        uv run ruff format --check .
        npx prettier --check .
      extra_allowed_tools: "Bash(uv run pytest:*),Bash(uv run ruff:*),Bash(npm test:*),Bash(npx prettier:*)"
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'agent:review' }}
    uses: ./.github/workflows/agent-review-reusable.yml
    with:
      kill_switch: ${{ vars.CLAUDE_PIPELINE_ENABLED != 'true' }}
      allowlist_actors: '["mnaimfaizy"]'
      trigger_label: "agent:review"
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      base_ref: ${{ github.event.pull_request.base.ref }}
      is_fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

# The Deprecation register (ADR 0010): each removed or renamed name, once.
#
# Each entry:
#   kind: variable, input, label, path or command
#   old: the name that was removed or renamed; a folder (kind path) ends in /,
#     and then any file below it is a mention too
#   replacement: the name to use instead, or null when it was removed with none
#   release: the release the change shipped in (no leading v)
#   allowed_paths: tracked files (or folders, ending in /) that may still name
#     `old`, one per line, or [] for none
#
# History (docs/adr/, CHANGELOG.md, release-notes/) may always name an old
# name. scripts/deprecation-register-contract.test.py fails on any other
# mention, scripts/cli-doctor-contract.test.mjs checks that doctor's rename
# map (RENAMED_VARIABLES) equals the variable entries that have a replacement,
# and scripts/release-tooling-contract.test.py fails on an entry that
# scripts/release.py cannot read.

# ADR 0009: every Stage setting is CLAUDE_<STAGE>_<SETTING> (#246).
- kind: variable
  old: CLAUDE_PIPELINE_ENABLED
  replacement: CLAUDE_AGENT_FLOW_ENABLED
  release: 1.0.0-beta.8
  allowed_paths:
    - cli/src/checks/secrets-and-variables.mjs
    - scripts/cli-doctor-contract.test.mjs
- kind: variable
  old: CLAUDE_MODEL_PLAN
  replacement: CLAUDE_PLAN_MODEL
  release: 1.0.0-beta.8
  allowed_paths:
    - cli/src/checks/secrets-and-variables.mjs
    - scripts/cli-doctor-contract.test.mjs
- kind: variable
  old: CLAUDE_MODEL_IMPLEMENT
  replacement: CLAUDE_IMPLEMENT_MODEL
  release: 1.0.0-beta.8
  allowed_paths:
    - cli/src/checks/secrets-and-variables.mjs
    - scripts/cli-doctor-contract.test.mjs
- kind: variable
  old: CLAUDE_MODEL_REVIEW
  replacement: CLAUDE_REVIEW_MODEL
  release: 1.0.0-beta.8
  allowed_paths:
    - cli/src/checks/secrets-and-variables.mjs
    - scripts/cli-doctor-contract.test.mjs
- kind: variable
  old: CLAUDE_MODEL_REVIEW_RESPONSE
  replacement: CLAUDE_REVIEW_RESPONSE_MODEL
  release: 1.0.0-beta.8
  allowed_paths:
    - cli/src/checks/secrets-and-variables.mjs
    - scripts/cli-doctor-contract.test.mjs
- kind: variable
  old: CLAUDE_MODEL_AUDIT
  replacement: CLAUDE_SECURITY_AUDIT_MODEL
  release: 1.0.0-beta.8
  allowed_paths:
    - cli/src/checks/secrets-and-variables.mjs
    - scripts/cli-doctor-contract.test.mjs

# The Security Response Run's board in RUN.md replaces the status format (#348).
- kind: path
  old: .claude/skills/security-response/STATUS-FORMAT.md
  replacement: .claude/skills/security-response/RUN.md
  release: 1.0.0-beta.10
  allowed_paths: []


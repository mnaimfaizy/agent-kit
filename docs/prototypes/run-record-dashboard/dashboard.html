<!doctype html>
<!--
  PROTOTYPE, throwaway (wayfinder ticket #394 "Dashboard designs for Run Records", map #391).
  Four structurally different dashboard designs for a Consumer, switchable via ?variant=A..D
  and the floating bar (or ← →). Views: ?view=run | runs | team. Never merged.
  Data: the two hand-derived Run Records (real) + clearly marked SYNTHETIC records for the
  across-runs trend and the Team Run, which have no real sample yet.
  `cause` is not in the v0 records: this page assigns one per human step (see causeOf) to
  show what the decided field would let the dashboard do.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Record Dashboard</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --ink:#1c1d1f; --muted:#6b6e75; --line:#e2e2de; --soft:#efefeb;
  --accent:#3b5bdb; --warn:#c2410c; --ok:#2f9e44;
  --c-by-design:#9aa0a6; --c-human-choice:#5c7cfa; --c-harness-limit:#e8590c; --c-permission-refusal:#d6336c;
  --c-missing-config:#f59f00; --c-spec-gap:#12b886; --c-skill-bug:#7048e8; --c-tool-missing:#1098ad; --c-other:#495057;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141517; --panel:#1d1e21; --ink:#e7e7e4; --muted:#9a9ca3; --line:#2e3034; --soft:#25272b; --accent:#748ffc;
}}
:root[data-theme="dark"]{ --bg:#141517; --panel:#1d1e21; --ink:#e7e7e4; --muted:#9a9ca3; --line:#2e3034; --soft:#25272b; --accent:#748ffc; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:90px}
h1,h2,h3{margin:0;font-weight:600} h2{font-size:16px} h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top .proto{font:11px var(--mono);background:#ffe066;color:#222;padding:2px 6px;border-radius:3px}
.top select,.top button{font:inherit;padding:4px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.top button.on{background:var(--ink);color:var(--panel)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)} .small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.syn{font:10px var(--mono);background:repeating-linear-gradient(45deg,#ffe06655,#ffe06655 4px,transparent 4px,transparent 8px);border:1px dashed #c9a400;padding:0 5px;border-radius:3px}
table{border-collapse:collapse;width:100%} th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13px} th{color:var(--muted);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px} @media(max-width:800px){.grid2{grid-template-columns:1fr}}
.kpis{display:flex;flex-wrap:wrap;gap:24px} .kpi b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums} .kpi span{color:var(--muted);font-size:12px}
svg text{fill:var(--ink);font-size:11px} svg .mt{fill:var(--muted)}
.scroll{overflow-x:auto}
/* switcher */
.switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;border-radius:99px;display:flex;align-items:center;gap:6px;padding:6px 8px;box-shadow:0 6px 24px #0006;z-index:20;font:13px system-ui}
.switch button{background:#333;color:#fff;border:0;border-radius:99px;width:30px;height:30px;cursor:pointer;font-size:15px}
.switch .lbl{min-width:220px;text-align:center}
/* variant D */
.term{background:#0f1115;color:#d4d7dd;font:12.5px/1.5 var(--mono);padding:18px;border-radius:10px;white-space:pre;overflow-x:auto}
.term .h{color:#ffd43b} .term .d{color:#868e96} .term .r{color:#ff8787} .term .g{color:#8ce99a} .term .b{color:#74c0fc}
/* variant C */
.feed{position:relative;margin-left:90px} .feed:before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.ev{position:relative;padding:5px 10px;margin:4px 0;border-radius:8px}
.ev .t{position:absolute;left:-104px;width:80px;text-align:right;font:11px var(--mono);color:var(--muted);top:7px}
.ev:before{content:"";position:absolute;left:-19px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.ev.human{background:var(--soft);border-left:3px solid var(--warn)} .ev.human:before{background:var(--warn)}
.ev.del:before{background:var(--accent)} .ev.cos:before{background:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start} @media(max-width:900px){.cgrid{grid-template-columns:1fr}}
.sticky{position:sticky;top:64px}
/* variant B */
.waffle{display:flex;flex-wrap:wrap;gap:3px} .waffle i{width:16px;height:16px;border-radius:3px;display:block}
.heat td.num{min-width:34px}
.todo{border-left:4px solid var(--accent);padding:8px 12px;margin:8px 0;background:var(--soft);border-radius:0 8px 8px 0}
.todo b{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
</style>
</head>

  if (typed.length) out.push({ n:typed.length, cause:'harness-limit', what:`${typed.length} QA commands were typed by hand`, fix:'Start QA Delegations with a brief instead of the typed route.' });

  <div class="grid2">
   <div class="panel"><h2>Fix these next run</h2>${nr.map(n=>`<div class="todo" style="border-color:${col(n.cause)}"><b>−${n.n}</b> ${esc(n.what)}<div class="small muted">${esc(n.fix)}</div></div>`).join('')}</div>
   <div class="panel heat"><h2>Kind × cause</h2><div class="scroll"><table><tr><th>kind</th>${used.map(c=>`<th class="num" title="${c}"><span class="dot" style="background:${col(c)}"></span></th>`).join('')}<th class="num">Σ</th></tr>
   ${kinds.map(k=>`<tr><td class="mono small">${k}</td>${used.map(c=>{const n=cell(k,c);return `<td class="num" style="background:${n?`color-mix(in srgb, ${col(c)} ${20+60*n/maxCell}%, transparent)`:''}">${n||''}</td>`}).join('')}<td class="num">${r.touches.filter(t=>t.k===k).length}</td></tr>`).join('')}</table></div></div></div>
  <div class="panel"><h2>Delegations</h2><table><tr><th>Delegation</th><th>kind</th><th>start</th><th class="num">time</th><th class="num">human steps</th><th class="num">send-backs</th><th>outcome</th></tr>
  ${r.dels.map(d=>`<tr><td class="mono">${d.id}</td><td>${d.kind}</td><td>${d.route==='card'?'<span class="chip" style="color:var(--warn)">card</span>':'direct'}</td><td class="num">${d.s&&d.e?mins(d.e-d.s):'<span class="muted">'+(d.day||'?')+'</span>'}</td><td class="num"><b>${d.touches||''}</b></td><td class="num">${d.sendBacks||''}</td><td>${d.outcome}</td></tr>`).join('')}</table></div>`;
}, runs(list){
  const maxT = Math.max(...list.map(r=>r.touches.length));
  return `<div class="panel"><h2>Human steps per run</h2><div class="small muted">Bar = human steps, coloured by cause (faded = by design or the human's choice). Ratio = steps per Delegation.</div>
  <table><tr><th>Run</th><th>authority</th><th class="num">Deleg.</th><th style="width:45%">human steps by cause</th><th class="num">total</th><th class="num">avoidable</th><th class="num">per Deleg.</th></tr>
  ${list.map(r=>{const cc=causeCounts(r.touches);const av=r.touches.filter(t=>AVOIDABLE(t.cause)).length;return `<tr><td class="mono small">${r.id}${synTag(r)}</td><td>${r.authority}</td><td class="num">${r.dels.length}</td><td>${stackBar(cc,Math.max(8,r.touches.length/maxT*420))}</td><td class="num">${r.touches.length}</td><td class="num" style="color:var(--warn)">${av}</td><td class="num">${(r.touches.length/r.dels.length).toFixed(1)}</td></tr>`}).join('')}</table>${legend()}</div>
  <div class="panel"><h2>Most common avoidable causes across runs</h2>${(()=>{const all=causeCounts(list.flatMap(r=>r.touches));return CAUSES.filter(c=>AVOIDABLE(c)&&all[c]).sort((a,b)=>all[b]-all[a]).map(c=>`<div class="todo" style="border-color:${col(c)}"><b>${all[c]}</b> ${c} <span class="small muted">in ${list.filter(r=>r.touches.some(t=>t.cause===c)).length} of ${list.length} runs</span></div>`).join('')})()}</div>`;
}, team(list){
  return `<div class="panel"><h2>Team Run: spec #${list[0].team.spec} <span class="syn">synthetic</span></h2><div class="small muted">Who was needed, how often, and for what. One column per teammate.</div>
  <div style="display:grid;grid-template-columns:repeat(${list.length},1fr);gap:12px;margin-top:10px">${list.map(r=>`<div class="panel" style="margin:0"><b>${r.operator}</b><div style="font-size:32px;font-weight:700">${r.touches.length}</div><div class="small muted">human steps · ${r.dels.length} Delegations · ${hrs(r.end-r.start)}</div><div class="waffle" style="margin-top:8px">${r.touches.map(t=>`<i style="background:${col(t.cause)};${AVOIDABLE(t.cause)?'':'opacity:.45'}" title="${t.k} · ${t.cause}"></i>`).join('')}</div>${nextRun(r).filter(n=>!n.data).slice(0,2).map(n=>`<div class="small" style="margin-top:6px">− ${esc(n.what)}</div>`).join('')}</div>`).join('')}</div>${legend()}</div>`;
}};

// ───────────────────────── VARIANT C: Run story (feed) ─────────────────────────
function events(r){
  const ev = [];
  const at = (w) => w.p==='exact' ? w.t : w.p==='bounds' ? w.t : null;
  r.dels.forEach(d=>{ if(d.s) ev.push({t:d.s,cls:'del',txt:`<b>${d.id}</b> starts${d.route==='card'?' (from a card)':''} <span class="muted small">· ${d.kind} #${d.issue} · from ${d.sSrc}</span>`});
    if(d.e) ev.push({t:d.e,cls:'del',txt:`<b>${d.id}</b> ${d.eSrc} after ${mins(d.e-d.s)} <span class="muted small">· ${d.outcome}${d.sendBacks?' · '+d.sendBacks+' send-backs':''}</span>`});
    if(!d.s && d.day) ev.push({day:d.day,cls:'del',txt:`<b>${d.id}</b> ran <span class="muted small">· ${d.kind} · ${d.outcome} · no times recorded</span>`}); });
  r.touches.forEach(t=>ev.push({t:at(t.w),day:t.w.day,approx:t.w.p!=='exact',cls:'human',txt:`<b>You</b>: ${t.k} ${causeChip(t.cause)} <span class="muted small">${t.del?'· '+t.del+' ':''}· ${waitTxt(t)}${t.hb?' · '+t.hb+' heartbeat'+(t.hb>1?'s':'')+' waiting':''}</span>`}));
  r.writes.forEach(w=>ev.push({t:at(w.w),day:w.w.day,approx:w.w.p!=='exact',cls:'cos',txt:`<span class="muted">Chief of Staff: ${w.k} (actor <span class="mono">${w.actor}</span>)</span>`}));
  r.reviews.forEach(v=>v.t&&ev.push({t:v.t,cls:'cos',txt:`<span class="muted">Review round ${v.round}: ${v.findings} findings${v.e?' in '+mins(v.e-v.t):''}</span>`}));
  r.ci.forEach(c=>c.t&&ev.push({t:c.t,cls:'cos',txt:`<span class="muted">CI <span style="color:${c.result==='pass'?'var(--ok)':'var(--warn)'}">${c.result}</span></span>`}));
  const key = e => e.t ?? (Date.parse(e.day+'T23:59:00Z'));
  return ev.sort((a,b)=>key(a)-key(b));
}
const C = { name: 'Run story', run(r){
  const ev = events(r); let lastDay = '';
  const maxD = Math.max(...r.dels.map(d=>d.s&&d.e?d.e-d.s:0),1);
  return `<div class="cgrid"><div class="panel"><h2>${r.id}${synTag(r)}</h2><div class="small muted" style="margin-bottom:10px">Read top to bottom. Orange rows are the times you were needed. ~ = time only known between two bounds; "day" = date only.</div><div class="feed">
  ${ev.map(e=>{const d=e.t?ymd(e.t):e.day;const hdr=d!==lastDay?`<div style="margin:12px 0 4px -90px;font-weight:600">${d}</div>`:'';lastDay=d;return hdr+`<div class="ev ${e.cls}"><span class="t">${e.t?(e.approx?'~':'')+hm(e.t):'day'}</span>${e.txt}</div>`}).join('')}
  </div></div>
  <div class="sticky"><div class="panel"><h3>Delegation time</h3>${r.dels.map(d=>`<div style="display:flex;align-items:center;gap:6px;margin:5px 0" class="small"><span class="mono" style="width:80px">${d.id}</span><svg width="140" height="10"><rect width="${d.s&&d.e?(d.e-d.s)/maxD*140:0}" height="10" rx="2" fill="${d.kind==='qa'?'var(--c-spec-gap)':'var(--accent)'}"/></svg><span class="mono">${d.s&&d.e?mins(d.e-d.s):'?'}</span>${d.touches?`<span class="chip" style="color:var(--warn)">${d.touches}✋</span>`:''}</div>`).join('')}</div>
  <div class="panel"><h3>Retro: next run</h3>${nextRun(r).map(n=>`<div style="margin:8px 0" class="small"><b>${esc(n.what)}</b><br><span class="muted">${esc(n.fix)}</span></div>`).join('')}</div></div></div>`;
}, runs(list){
  const metrics = [['duration h',r=>(r.end-r.start)/3600e3],['Delegations',r=>r.dels.length],['human steps',r=>r.touches.length],['avoidable',r=>r.touches.filter(t=>AVOIDABLE(t.cause)).length],['card starts',r=>r.touches.filter(t=>/card-start/.test(t.k)).length],['send-backs',r=>r.dels.reduce((a,d)=>a+d.sendBacks,0)],['review rounds',r=>r.reviews.length],['known wait m',r=>r.touches.reduce((a,t)=>a+(t.wait??t.waitMax??0),0)]];
  const max = metrics.map(([,f])=>Math.max(...list.map(f),1));
  return `<div class="panel"><h2>Runs at a glance</h2><div class="small muted">Darker = more. Read down a column to see a trend.</div><div class="scroll"><table><tr><th>Run</th>${metrics.map(([m])=>`<th class="num">${m}</th>`).join('')}</tr>
  ${list.map(r=>`<tr><td class="mono small">${r.id}${synTag(r)}<div class="muted">${r.operator} · ${r.authority}</div></td>${metrics.map(([,f],i)=>{const v=f(r);return `<td class="num" style="background:color-mix(in srgb, var(--warn) ${Math.round(v/max[i]*70)}%, transparent)">${Number.isInteger(v)?v:v.toFixed(1)}</td>`}).join('')}</tr>`).join('')}</table></div></div>`;
}, team(list){
  const all = list.flatMap(r=>events(r).map(e=>({...e,op:r.operator}))).filter(e=>e.t).sort((a,b)=>a.t-b.t);
  const ops = list.map(r=>r.operator), hue = o => ['var(--c-human-choice)','var(--c-spec-gap)','var(--c-skill-bug)'][ops.indexOf(o)%3];
  return `<div class="panel"><h2>Team Run: spec #${list[0].team.spec} <span class="syn">synthetic</span></h2><div class="small muted">Everyone's runs in one story; the coloured edge says whose Chief of Staff wrote it.</div>
  <div style="margin:8px 0">${ops.map(o=>`<span class="chip" style="border-left:4px solid ${hue(o)}">${o}</span>`).join(' ')}</div>
  <div class="feed">${all.map(e=>`<div class="ev ${e.cls}" style="box-shadow:inset 4px 0 0 ${hue(e.op)}"><span class="t">${hm(e.t)}</span><span class="small mono muted">${e.op}</span> ${e.txt.replace('<b>You</b>','<b>'+e.op+'</b>')}</div>`).join('')}</div></div>`;
}};

// ───────────────────────── VARIANT D: Terminal report (no page) ─────────────────────────
const pad = (s,n) => (String(s)+' '.repeat(n)).slice(0,n), lpad = (s,n) => (' '.repeat(n)+String(s)).slice(-n);
function asciiBar(r, d, W=48){ if(!d.s||!d.e) return '·'.repeat(W); const a=Math.round((d.s-r.start)/(r.end-r.start)*W), b=Math.max(a+1,Math.round((d.e-r.start)/(r.end-r.start)*W)); return ' '.repeat(a)+(d.sSrc==='exact'?'█':'▓').repeat(b-a)+' '.repeat(Math.max(0,W-b)); }
const D = { name: 'Terminal report (orchestrate --report)', run(r){
  const cc = causeCounts(r.touches), nr = nextRun(r);
  let o = `<span class="d">$ orchestrate --report ${r.id}</span>\n\n<span class="h">Run ${r.id}</span>${r.synthetic?'  <span class="r">[synthetic]</span>':''}\n`;
  o += `  ${r.kind} #${r.spec} · ${r.authority} · ${r.landing} · ${r.outcome} · ${hrs(r.end-r.start)}${r.startBound?' (start is a bound)':''}\n  ${ymd(r.start)} ${hm(r.start)} → ${ymd(r.end)} ${hm(r.end)} UTC\n\n`;
  o += `<span class="h">Delegations</span>${' '.repeat(16)}${hm(r.start)}${' '.repeat(38)}${hm(r.end)}\n`;
  r.dels.forEach(d=>{ o += `  ${pad(d.id,11)} ${pad(d.kind,8)} ${pad(d.route,6)} |<span class="b">${asciiBar(r,d)}</span>| ${lpad(d.s&&d.e?mins(d.e-d.s):'?',5)}  ${d.touches?'<span class="r">'+d.touches+' human</span>':''}\n`; });
  o += `  <span class="d">█ exact  ▓ start/end from commits  · no times</span>\n\n<span class="h">Human steps: ${r.touches.length}</span> (${r.touches.filter(t=>AVOIDABLE(t.cause)).length} avoidable, ${r.touches.filter(t=>t.w.p==='exact').length} with exact time)\n`;
  CAUSES.filter(c=>cc[c]).sort((a,b)=>cc[b]-cc[a]).forEach(c=>{ const ks={}; r.touches.filter(t=>t.cause===c).forEach(t=>ks[t.k]=(ks[t.k]||0)+1);
    o += `  ${AVOIDABLE(c)?'<span class="r">':'<span class="d">'}${pad(c,19)}</span>${lpad(cc[c],3)}  ${'■'.repeat(cc[c])}\n${Object.entries(ks).map(([k,n])=>`  <span class="d">${' '.repeat(22)}${lpad(n,3)} ${k}</span>`).join('\n')}\n`; });
  o += `\n<span class="h">Next run</span>\n` + nr.map((n,i)=>`  ${i+1}. ${n.what}\n     <span class="g">→ ${n.fix}</span>`).join('\n');
  o += `\n\n<span class="d">Also: --report --runs · --report --team &lt;spec&gt; · --report --json</span>`;
  return `<div class="term">${o}</div><div class="note">Delivery proposal: no page at all. The Chief of Staff prints this at close-out and on demand; the same derivation can write a page later.</div>`;
}, runs(list){
  let o = `<span class="d">$ orchestrate --report --runs</span>\n\n<span class="h">${pad('run',26)} ${pad('who',13)} ${pad('auth',10)} ${lpad('dur',6)} ${lpad('del',4)} ${lpad('human',6)} ${lpad('avoid',6)}  trend</span>\n`;
  list.forEach(r=>{ const av=r.touches.filter(t=>AVOIDABLE(t.cause)).length; o += `${pad(r.id,26)} ${pad(r.operator,13)} ${pad(r.authority,10)} ${lpad(hrs(r.end-r.start),6)} ${lpad(r.dels.length,4)} ${lpad(r.touches.length,6)} <span class="r">${lpad(av,6)}</span>  ${'▮'.repeat(Math.ceil(av/2))}${r.synthetic?' <span class="d">synthetic</span>':''}\n`; });
  const all = causeCounts(list.flatMap(r=>r.touches));
  o += `\n<span class="h">Top avoidable causes</span>\n` + CAUSES.filter(c=>AVOIDABLE(c)&&all[c]).sort((a,b)=>all[b]-all[a]).map(c=>`  ${pad(c,19)} ${lpad(all[c],3)}`).join('\n');
  return `<div class="term">${o}</div>`;
}, team(list){
  const t0 = Math.min(...list.map(r=>r.start)), t1 = Math.max(...list.map(r=>r.end)), W = 48;
  let o = `<span class="d">$ orchestrate --report --team ${list[0].team.spec}</span>   <span class="r">[synthetic]</span>\n\n<span class="h">Team Run spec #${list[0].team.spec}</span>   ${hm(t0)} → ${hm(t1)} UTC\n\n`;
  list.forEach(r=>{ o += `<span class="h">${r.operator}</span>  ${r.dels.length} Delegations · ${r.touches.length} human steps · ${hrs(r.end-r.start)}\n`;
    r.dels.forEach(d=>{ const a=Math.round((d.s-t0)/(t1-t0)*W), b=Math.max(a+1,Math.round((d.e-t0)/(t1-t0)*W)); o += `  ${pad(d.id,8)} |<span class="b">${' '.repeat(a)+'█'.repeat(b-a)+' '.repeat(Math.max(0,W-b))}</span>| ${d.touches?'<span class="r">'+d.touches+' human</span>':''}\n`; }); o+='\n'; });
  return `<div class="term">${o}</div>`;
}};

// ───────────────────────── switcher + views ─────────────────────────
const VARIANTS = { A, B, C, D }, KEYS = Object.keys(VARIANTS);
const VIEWS = [['run','This run'],['runs','Across runs'],['team','Team Run']];
const STATE = new URLSearchParams(location.search);
const q = () => STATE;
function set(k, v){ STATE.set(k, v); try { history.replaceState(null, '', '?' + STATE); } catch (e) { /* data:/file preview: keep state in memory */ } render(); }
function render(){
  const p = q(), v = KEYS.includes(p.get('variant')) ? p.get('variant') : 'A', view = p.get('view') || 'run';
  const runId = p.get('run') || RAW[RAW.length-1].run.id, r = RUNS.find(x=>x.id===runId) || RUNS[0];
  document.getElementById('views').innerHTML = VIEWS.map(([k,l])=>`<button class="${k===view?'on':''}" data-view="${k}">${l}</button>`).join(' ');
  const sel = document.getElementById('runSel'); sel.style.display = view==='run' ? '' : 'none';
  sel.innerHTML = RUNS.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${x.id}${x.synthetic?' (synthetic)':''}</option>`).join('');
  document.getElementById('where').textContent = view==='run' ? `${r.tickets.length} tickets · PRs ${r.prs.join(', ')||'—'}` : view==='runs' ? `${SOLO.length} runs (${SOLO.filter(x=>x.synthetic).length} synthetic)` : `${TEAM.length} teammates`;
  const V = VARIANTS[v];
  document.getElementById('app').innerHTML = view==='runs' ? V.runs(SOLO) : view==='team' ? V.team(TEAM) : V.run(r);
  document.getElementById('vlabel').textContent = `${v} (${V.name})`;
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>set('view',b.dataset.view));
}
const cycle = d => { const v = q().get('variant') || 'A'; set('variant', KEYS[(KEYS.indexOf(v)+d+KEYS.length)%KEYS.length]); };
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('runSel').onchange = e => set('run', e.target.value);
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key==='ArrowLeft') cycle(-1); if (e.key==='ArrowRight') cycle(1); });
render();
</script>
</body>
</html>

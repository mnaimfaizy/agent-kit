name: security-audit-caller-example

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full or pr"
        required: false
        default: "full"
      pr_number:
        description: "PR number for pr mode counts-only comment"
        required: false
        default: ""
      head_sha:
        description: "PR head SHA (pr mode only; leave empty for full)"
        required: false
        default: ""
      base_sha:
        description: "PR base SHA (pr mode only; leave empty for full)"
        required: false
        default: ""
      base_ref:
        description: "PR base branch (pr mode)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  audit:
    uses: mnaimfaizy/agent-kit/.github/workflows/security-audit-reusable.yml@v1.0.0-alpha.6
    with:
      mode: ${{ inputs.mode }}
      kill_switch: ${{ vars.CLAUDE_SECURITY_AUDIT_ENABLED != 'true' }}
      model: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
      allowlist_actors: '["your-github-login"]'
      threat_model_path: ".security/threat-model.md"
      findings_ledger_path: ".security/findings-ledger.md"
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      base_ref: ${{ inputs.base_ref }}
      notify_email: false
      scan_command: ""
    secrets:
      advisories_token: ${{ secrets.AGENT_KIT_ADVISORIES_TOKEN }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      notify_email_to: ${{ secrets.AGENT_KIT_NOTIFY_EMAIL_TO }}
      notify_email_from: ${{ secrets.AGENT_KIT_NOTIFY_EMAIL_FROM }}
      notify_email_smtp_host: ${{ secrets.AGENT_KIT_NOTIFY_SMTP_HOST }}
      notify_email_smtp_port: ${{ secrets.AGENT_KIT_NOTIFY_SMTP_PORT }}
      notify_email_smtp_username: ${{ secrets.AGENT_KIT_NOTIFY_SMTP_USERNAME }}
      notify_email_smtp_password: ${{ secrets.AGENT_KIT_NOTIFY_SMTP_PASSWORD }}

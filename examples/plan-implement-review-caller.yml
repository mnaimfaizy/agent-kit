name: agent-pipeline

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number"
        required: true
      mode:
        description: "plan | implement | review"
        required: true
        default: "plan"
      pr_number:
        description: "PR number (review)"
        required: false
        default: ""
      head_sha:
        description: "PR head SHA (review)"
        required: false
        default: ""
      base_sha:
        description: "PR base SHA (review)"
        required: false
        default: ""
      base_ref:
        description: "PR base branch (review)"
        required: false
        default: "main"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  plan:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent:plan') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'plan')
    uses: mnaimfaizy/agent-kit/.github/workflows/agent-plan-reusable.yml@v1.0.0-beta.5
    with:
      kill_switch: ${{ vars.CLAUDE_PIPELINE_ENABLED != 'true' }}
      model: ${{ vars.CLAUDE_MODEL_PLAN || vars.CLAUDE_MODEL || 'claude-opus-5' }}
      allowlist_actors: '["your-github-login"]'
      trigger_label: "agent:plan"
      issue_number: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue_number }}
      planner_marker: "<!-- agent-kit-plan -->"
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  implement:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent:implement') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'implement')
    uses: mnaimfaizy/agent-kit/.github/workflows/agent-implement-reusable.yml@v1.0.0-beta.5
    with:
      kill_switch: ${{ vars.CLAUDE_PIPELINE_ENABLED != 'true' }}
      model: ${{ vars.CLAUDE_MODEL_IMPLEMENT || vars.CLAUDE_MODEL || 'claude-opus-5' }}
      allowlist_actors: '["your-github-login"]'
      trigger_label: "agent:implement"
      issue_number: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue_number }}
      planner_marker: "<!-- agent-kit-plan -->"
      trusted_plan_author: "github-actions[bot]"
      base_branch: "main"
      verify_commands: |
        # verify_commands run via `bash -c`; set -e makes any failing command fail the job.
        set -e
        echo "Provide Consumer verify commands here (lint/tests/typecheck)."
      # Don't copy CI test env into verify_commands: a password variable such as
      # DATABASE_PASSWORD, even with a throwaway test value, sets off
      # secret scanners. Export non-secret settings only.
      # setup_commands installs the Consumer toolchain before the agent and again
      # before verify_commands. It is one plain bash step, so actions such as
      # actions/setup-python can't run in it; put a version from the runner tool
      # cache (/opt/hostedtoolcache) on $GITHUB_PATH instead. Copy a preset from
      # examples/setup-presets/ (python.sh, node.sh, mixed.sh, redis-service.sh)
      # into the block and edit it:
      # setup_commands: |
      #   set -euo pipefail
      #   ...
      # extra_allowed_tools appends reviewed Bash rules, for example Bash(npm:*).
      # Branch naming defaults to claude/issue-<N>-<timestamp>. To match a branch
      # policy, set a prefix and/or a template that keeps {{entityNumber}}:
      # branch_prefix: "fix/"
      # branch_name_template: "{{prefix}}{{entityNumber}}-{{description}}"
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'agent:review') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'review')
    uses: mnaimfaizy/agent-kit/.github/workflows/agent-review-reusable.yml@v1.0.0-beta.5
    with:
      kill_switch: ${{ vars.CLAUDE_PIPELINE_ENABLED != 'true' }}
      model: ${{ vars.CLAUDE_MODEL_REVIEW || vars.CLAUDE_MODEL || 'claude-opus-5' }}
      allowlist_actors: '["your-github-login"]'
      trigger_label: "agent:review"
      pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
      base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || inputs.base_ref }}
      is_fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      planner_marker: "<!-- agent-kit-plan -->"
      trusted_plan_author: "github-actions[bot]"
      # Without a Verified plan, accept a maintainer's issue comment that starts
      # with <!-- agent-kit-brief --> as the spec. Logins only; empty turns it off.
      # trusted_spec_authors: '["your-github-login"]'
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

<div class="bar"><button id="prev" aria-label="Previous variant">&larr;</button><span class="label" id="blabel"></span><button id="next" aria-label="Next variant">&rarr;</button></div>
<script>
const keys=["Today","A","B","C"];
const params=new URLSearchParams(location.search);
let cur=keys.includes(location.hash.slice(1))?location.hash.slice(1):keys.includes(params.get("variant"))?params.get("variant"):"Today";
const out=document.getElementById("out"),rawbox=document.getElementById("rawbox");
function md(k){return document.getElementById(k).textContent.replace(/^\n/,"")}
function render(){
  const el=document.getElementById(cur),text=md(cur);
  const name=el.dataset.name;
  document.getElementById("vname").innerHTML="<b>"+cur+"</b> · "+name;
  const base=md("Today").length;
  document.getElementById("size").textContent=text.length.toLocaleString()+" characters, "+text.split("\n").length+" lines"+(cur==="Today"?"":" ("+Math.round(100*text.length/base)+"% of today's)");
  document.getElementById("blabel").textContent=cur+" ("+name+")";
  if(rawbox.checked||!window.marked){const p=document.createElement("pre");p.className="raw";p.textContent=text;out.replaceChildren(p)}
  else{out.innerHTML=marked.parse(text)}
  try{history.replaceState(null,"","#"+cur)}catch(e){}
}
function step(d){cur=keys[(keys.indexOf(cur)+d+keys.length)%keys.length];render()}
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
rawbox.onchange=render;
addEventListener("keydown",e=>{const t=e.target;if(t.closest&&t.closest("input,textarea,[contenteditable]"))return;if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
render();
</script>

# orchestrate.config.yml: Agent-kit's own facts for the orchestrate skill.
# This repository's config, not part of the kit: it is not in
# scripts/release-snapshot-manifest.txt or the CLI's copy lists.
# Template: examples/orchestrate.config.yml. Keys and defaults: CONFIG.md.
# Check: node .claude/skills/orchestrate/config.mjs check

run_dir: tmp/orchestrate

read_first:
  - AGENTS.md
  - CONTRIBUTING.md
  - GLOSSARY.md

routes:
  commit: "Conventional Commits (fix, feat, ci, docs, chore), one logical change per commit, with git commit and the Co-authored-by trailer the harness adds"
  pull_request: "gh pr create --draft --base main; fill in the PR template checklist; the body ends with Closes #<n>"
  merge: "gh pr merge <n> --merge"

# The Node line skips two tests that fail on macOS (they fail on main too) and
# pass on CI's ubuntu-latest, where ci.yml still runs them. Fixing them is a
# separate change. The rest of both suites runs.
regate:
  - uv run pytest
  - "node --test --test-skip-pattern='denies an out-of-tree read with the staged hook|exits non-zero from the command line on an unexpected key' scripts/*.test.mjs .claude/skills/*/*.test.mjs"
  - uv run ruff check .
  - uv run ruff format --check .
  - npm ci
  - npx prettier --check .

skills:
  implement: tdd
  triage: triage
  review: code-review

triage_labels: docs/agents/triage-labels.md

models:
  analysis: claude-sonnet-5-5
  build: claude-sonnet-5-5
  review: claude-sonnet-5-5
  qa: claude-sonnet-5-5

harness: claude-code-desktop

# executors is left out: every Delegation runs on the pinned harness.

limits:
  building: 3
  shared: []

decisions:
  to: pull-request

ready_to_merge:
  review: settled
  qa: report # a QA Delegation per head, only for an issue labeled qa
  qa_labels: [qa]
  review_workflow: detect

spec:
  landing: ask
  integration_branch: orchestrate/spec-<n>

tracker: detect

team:
  labels:
    planned: "team: planned"
    parked: "team: parked"
    running: "team: running"
    waiting: "team: waiting"
    ready_to_merge: "team: ready to merge"
    merged: "team: merged"
  recent_activity: 5
